<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>색상 연결 매칭 게임</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        }
        
        /* ⭕ [전체 화면 가이드라인] 전체 뷰포트는 꽉 채우되, 남는 공간의 배경을 지정합니다. */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #F7F9FF; /* 외곽 남는 공간은 차분한 다크 그레이로 마감 */
            overflow: hidden;
            position: fixed; 
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: none; 
        }

        /* ⭕ [iPad 1024*768 해상도 제한 및 박스 모델 정중앙 고정] */
        .app-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px;  /* 💻 가로 최대 1024px 박제 */
            max-height: 768px;  /* 💻 세로 최대 768px 박제 */
            background-color: #f0f4f8; /* 원래 게임 내부 배경색 유지 */
            display: flex;
            flex-direction: column;
            align-items: center;
            border-radius: 12px; /* 큰 화면에서 볼 때 예쁘게 라운딩 마감 */
            overflow: hidden;
        }
            @media (min-width: 1025px) and (min-height: 769px) {
          .app-wrapper {
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
          }
      }

        header {
            margin-top: 40px;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: 1.8rem;
            color: #1e293b;
            margin-bottom: 8px;
        }
        
        /* 게임 메인 컨테이너 */
        .game-container {
            position: relative;
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 150px; /* 큰 화면 비율에 맞춰 좌우 여백 소폭 확대 */
            touch-action: none;
        }

    

        .column {
            display: flex;
            flex-direction: column;
            gap: 30px; /* 1024*768 스케일에 맞춰 컴포넌트 간격 최적화 */
            z-index: 5;
        }
        .item {
            width: 170px; /* 로띠 벡터 해상도 대응을 위해 기하 구조 소폭 확대 */
            height: 170px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 6px 16px rgba(0,0,0,0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            font-weight: bold;
            color: #334155;
            border: 5px solid #e2e8f0;
            transition: transform 0.15s, border-color 0.15s;
            touch-action: none;
            overflow: hidden; 
        }
        .item:active {
            transform: scale(0.95);
        }
        .item.connected {
            pointer-events: none;
        }
        .item.color-node {
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.25);
            font-size: 2rem;
        }
        .lottie-view {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; 
        }
        .lottie-view svg {
            width: 90% !important;
            height: 90% !important;
            object-fit: contain;
        }
        
        /* SVG 선 레이어는 이제 .app-wrapper(1024*768 박스) 내부 기준으로만 전개됩니다 */
        svg.line-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        .game-line {
            stroke-linecap: round;
        }
        .game-line.drawing {
            stroke: #64748b !important;
            stroke-width: 7 !important;
        }
        .game-line.success {
            stroke-width: 7 !important;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.1)); 
        }

        /* ❌ 화면 정중앙 배치용 오답 마커 */
        .wrong-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px; 
            height: 120px;
            background-color: #ef4444;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.45);
            pointer-events: none;
            z-index: 90;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
        }
        .wrong-marker::before, .wrong-marker::after {
            content: '';
            position: absolute;
            width: 60px;
            height: 12px;
            background-color: #ffffff;
            border-radius: 6px;
        }
        .wrong-marker::before { transform: rotate(45deg); }
        .wrong-marker::after { transform: rotate(-45deg); }

        /* 성공 모달 */
        .modal-overlay {
            position: absolute; /* fixed에서 absolute로 변경하여 1024 박스 내부에만 귀속 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
        }
        .modal-content {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 80%;
            max-width: 340px;
            transform: scale(0.9);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes popIn {
            to { transform: scale(1); }
        }
        .modal-content h2 {
            color: #10b981;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }
        .modal-content p {
            color: #64748b;
            margin-bottom: 24px;
            font-size: 1rem;
        }
        .modal-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            transition: background-color 0.2s;
        }
        .modal-btn:active {
            background-color: #059669;
        }
    </style>

    <script src="/js/jquery-3.3.1.min.js"></script>
  <script src="/js/gsap-business-green/minified/gsap.min.js"></script>
  <script src="/js/lottie.min.js"></script>
</head>
<body>

    <!-- ⭕ 가로세로 최대 해상도 박제를 위해 전체 노드를 감싸는 껍데기 프레임 컨테이너 레이어 추가 -->
    <div class="app-wrapper">
        <header>
            <h1 id="game-title">색상 맞추기</h1>
            <p id="game-desc" style="color: #64748b; font-size: 0.95rem;">연결해 보세요!</p>
        </header>

        <div class="game-container" id="game-zone">
            <svg class="line-layer" id="svg-layer"></svg>
            <div class="column" id="left-column"></div>
            <div class="column" id="right-column"></div>
            
            <div class="wrong-marker" id="fail-marker"></div>
        </div>

        <div class="modal-overlay" id="success-modal">
            <div class="modal-content">
                <h2>참 잘했어요! 🎉</h2>
                <p>모든 색상을 완벽하게 매칭했습니다.</p>
                <button class="modal-btn" id="next-btn">다음 색상 맞추기</button>
            </div>
        </div>
    </div>

    <script src="./data.js"></script>
    <script src="./main.js"></script>
</body>
</html>
